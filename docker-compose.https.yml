services:
  vw-dash:
    image: ghcr.io/mo3he/vw-dash:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - vw-dash

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
